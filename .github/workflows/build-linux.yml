name: Tauri Linux Build

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libnice-dev \
            libwebrtc-audio-processing-dev \
            libunwind-dev

      - name: Install WebRTC-enabled WebKitGTK
        run: |
          # Ubuntu's stock libwebkit2gtk-4.1-dev lacks WebRTC support.
          # We need a build with -DENABLE_WEB_RTC=ON -DENABLE_MEDIA_STREAM=ON.
          # Try: PPA → prebuilt .deb → build from source (slowest).
          if sudo add-apt-repository -y ppa:webkit-team/ppa 2>/dev/null; then
            sudo apt-get update 2>/dev/null || true
            if sudo apt-get install -y libwebkit2gtk-4.1-dev 2>/dev/null; then
              echo "WebKitGTK installed from PPA"
              exit 0
            fi
          fi

          echo "PPA unavailable, trying prebuilt .deb from GitHub..."
          DEB_NAME="libwebkit2gtk-4.1-webrtc_2.46.6-1_amd64.deb"
          if wget -q "https://github.com/${{ github.repository }}/releases/latest/download/$DEB_NAME" -O "/tmp/$DEB_NAME" 2>/dev/null; then
            sudo dpkg -i "/tmp/$DEB_NAME"
            sudo ldconfig
            echo "WebKitGTK installed from prebuilt .deb"
            exit 0
          fi

          echo "Prebuilt .deb not found, building from source (this will take ~45 min)..."
          bash scripts/build-webkit-webrtc.sh

      - name: Set up Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: linux-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-registry-

      - name: Cache cargo git
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: linux-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-git-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: linux-cargo-build-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/tauri.conf.json') }}
          restore-keys: |
            linux-cargo-build-${{ hashFiles('**/Cargo.lock') }}
            linux-cargo-build-

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Tauri app for Linux
        run: cargo tauri build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts-v${{ steps.version.outputs.version }}
          path: target/release/bundle/deb/*_amd64.deb
          if-no-files-found: warn
