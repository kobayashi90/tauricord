name: Flatpak

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flatpak
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flatpak + flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Cache Flatpak runtimes
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-${{ runner.arch }}-gnome48-2408-${{ hashFiles('io.tauricord.yml') }}
          restore-keys: |
            flatpak-runtimes-${{ runner.arch }}-gnome48-2408-

      - name: Install GNOME Platform + SDK + Rust extension
        run: |
          flatpak install --noninteractive --user flathub \
            org.gnome.Platform//48 \
            org.gnome.Sdk//48 \
            org.freedesktop.Sdk.Extension.rust-stable//24.08

      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ runner.arch }}-${{ hashFiles('io.tauricord.yml', 'Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            flatpak-builder-${{ runner.arch }}-${{ hashFiles('io.tauricord.yml') }}-
            flatpak-builder-${{ runner.arch }}-

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Flatpak
        run: |
          flatpak-builder \
            --force-clean \
            --user \
            --repo=repo \
            --ccache \
            --disable-rofiles-fuse \
            build-dir \
            io.tauricord.yml

      - name: Export Flatpak bundle
        run: |
          flatpak build-bundle \
            --arch=$(flatpak --default-arch) \
            repo \
            Tauricord-v${{ steps.version.outputs.version }}.flatpak \
            io.tauricord.dev

      - name: Verify bundle
        run: |
          ls -lh Tauricord-v${{ steps.version.outputs.version }}.flatpak
          file Tauricord-v${{ steps.version.outputs.version }}.flatpak

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tauricord-v${{ steps.version.outputs.version }}.flatpak
          path: Tauricord-v${{ steps.version.outputs.version }}.flatpak
          if-no-files-found: error


