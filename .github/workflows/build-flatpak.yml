name: Flatpak

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-webkitgtk-webrtc:
    name: Build WebKitGTK + WebRTC
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache WebKitGTK tarball
        id: cache-tarball
        uses: actions/cache@v4
        with:
          path: webkitgtk-webrtc-2.52.3.tar.gz
          key: webkitgtk-webrtc-2.52.3-gnome50

      - name: Install Flatpak + GNOME SDK
        if: steps.cache-tarball.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          sudo flatpak remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --noninteractive flathub \
            org.gnome.Sdk//50 org.gnome.Platform//50

      - name: Download and prepare WebKitGTK source
        if: steps.cache-tarball.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/wkgtk-build/{source,install}
          curl -L https://webkitgtk.org/releases/webkitgtk-2.52.3.tar.xz \
            -o /tmp/webkitgtk-2.52.3.tar.xz
          echo "5b3e0d174e63dcc28848b1194e0e7448d5948c3c2427ecd931c2c5be5261aebb  /tmp/webkitgtk-2.52.3.tar.xz" | sha256sum -c
          tar xf /tmp/webkitgtk-2.52.3.tar.xz \
            -C /tmp/wkgtk-build/source --strip-components=1

      - name: Apply librice 0.4.x compatibility patch
        if: steps.cache-tarball.outputs.cache-hit != 'true'
        run: |
          patch -d /tmp/wkgtk-build/source -p1 < patches/librice-compat.patch

      - name: Build WebKitGTK with WebRTC inside GNOME SDK
        if: steps.cache-tarball.outputs.cache-hit != 'true'
        run: |
          flatpak run \
            --filesystem=/tmp/wkgtk-build:rw \
            --command=bash \
            org.gnome.Sdk//50 \
            -c '
              set -eux
              SRC=/tmp/wkgtk-build/source
              INST=/tmp/wkgtk-build/install
              cmake -S "$SRC" -B "$SRC/build" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$INST" \
                -DPORT=GTK \
                -DUSE_GTK4=OFF \
                -DUSE_SOUP2=OFF \
                -DENABLE_WEB_RTC=ON \
                -DENABLE_MEDIA_STREAM=ON \
                -DENABLE_MINIBROWSER=OFF \
                -DENABLE_DOCUMENTATION=OFF \
                -DENABLE_INTROSPECTION=OFF \
                -DENABLE_GAMEPAD=OFF \
                -DENABLE_SPELLCHECK=OFF \
                -DUSE_SYSTEM_UNIFDEF=OFF \
                -DENABLE_BUBBLEWRAP_SANDBOX=OFF \
                -DENABLE_SPEECH_SYNTHESIS=OFF \
                -DENABLE_WEBDRIVER=OFF \
                -DUSE_AVIF=OFF \
                -DUSE_JPEGXL=OFF \
                -DUSE_WOFF2=OFF \
                -DUSE_LCMS=OFF \
                -DUSE_LIBBACKTRACE=OFF \
                -DUSE_SYSTEM_MALLOC=ON
              ninja -C "$SRC/build" -j$(nproc)
              ninja -C "$SRC/build" install
            '

      - name: Package tarball
        if: steps.cache-tarball.outputs.cache-hit != 'true'
        run: |
          find /tmp/wkgtk-build/install -name 'libwebkit2gtk*' -o -name 'libjavascriptcoregtk*' -o -name 'WebKitWebProcess' -o -name 'WebKitNetworkProcess' 2>/dev/null
          cd /tmp/wkgtk-build/install
          tar -czf ${{ github.workspace }}/webkitgtk-webrtc-2.52.3.tar.gz \
            $(find . \( -name 'libwebkit2gtk-4.1*' -o -name 'libjavascriptcoregtk-4.1*' -o -path '*/libexec/webkit2gtk-4.1/*' \) ! -name '*.la' ! -name '*.a')

      - name: Upload WebKitGTK artifact
        uses: actions/upload-artifact@v4
        with:
          name: webkitgtk-webrtc
          path: webkitgtk-webrtc-2.52.3.tar.gz
          retention-days: 90

  build-flatpak:
    name: Build Tauricord Flatpak
    needs: build-webkitgtk-webrtc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Download WebKitGTK artifact
        uses: actions/download-artifact@v4
        with:
          name: webkitgtk-webrtc
          path: .

      - name: Install Flatpak + flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Cache Flatpak runtimes
        uses: actions/cache@v4
        with:
          path: /var/lib/flatpak
          key: flatpak-runtimes-${{ runner.arch }}-gnome50-2508-${{ hashFiles('io.tauricord.yml') }}
          restore-keys: |
            flatpak-runtimes-${{ runner.arch }}-gnome50-2508-

      - name: Install GNOME Platform + SDK
        run: |
          sudo flatpak install --noninteractive flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50

      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ runner.arch }}-${{ hashFiles('io.tauricord.yml', 'Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            flatpak-builder-${{ runner.arch }}-${{ hashFiles('io.tauricord.yml') }}-
            flatpak-builder-${{ runner.arch }}-

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Flatpak
        run: |
          sudo flatpak-builder \
            --force-clean \
            --repo=repo \
            --ccache \
            --disable-rofiles-fuse \
            build-dir \
            io.tauricord.yml

      - name: Export Flatpak bundle
        run: |
          flatpak build-bundle \
            --arch=$(flatpak --default-arch) \
            repo \
            Tauricord-v${{ steps.version.outputs.version }}.flatpak \
            io.tauricord.dev

      - name: Verify bundle
        run: |
          ls -lh Tauricord-v${{ steps.version.outputs.version }}.flatpak
          file Tauricord-v${{ steps.version.outputs.version }}.flatpak

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tauricord-v${{ steps.version.outputs.version }}.flatpak
          path: Tauricord-v${{ steps.version.outputs.version }}.flatpak
          if-no-files-found: error
